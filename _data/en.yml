about: |
  I am a postdoctoral fellow of the [National Scientific and Technical Research Council (CONICET)](https://www.conicet.gov.ar) and an Assistant Professor at the Facultad de Ingeniería Química (FIQ) of the Universidad Nacional del Litoral (UNL) in Santa Fe, Argentina.

  I work on the numerical analysis of partial differential equations, in particular on the design of convergent methods for geometric flows of surfaces with boundary. You can find my work under [Research](#research).

  **Research interests:** numerical analysis and scientific computing; numerical methods for PDEs; finite element methods; geometric flows; isogeometric analysis and hierarchical splines.
  
  **Contact:** [bivaniszyn@fiq.unl.edu.ar](mailto:bivaniszyn@fiq.unl.edu.ar)

