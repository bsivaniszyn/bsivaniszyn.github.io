about: |
  Soy becaria posdoctoral del [Consejo Nacional de Investigaciones Científicas y Técnicas (CONICET)](https://www.conicet.gov.ar) y Profesora Adjunta en la Facultad de Ingeniería Química (FIQ) de la Universidad Nacional del Litoral (UNL), en Santa Fe, Argentina.

  Trabajo en análisis numérico de ecuaciones diferenciales parciales, en particular en el diseño de métodos convergentes para flujos geométricos de superficies con borde. Mis trabajos están en [Investigación](#investigacion).

  **Intereses de investigación:** análisis numérico y computación científica; métodos numéricos para EDPs; métodos de elementos finitos; aproximación numérica de flujos geométricos de superficies; análisis isogeométrico y splines jerárquicos.

  **Contacto:** [bivaniszyn@fiq.unl.edu.ar](mailto:bivaniszyn@fiq.unl.edu.ar)

